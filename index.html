<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tank War</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#10151d;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:18px;background:#182331;border-bottom:2px solid #3bd6c6}
h1{margin:0;color:#3bd6c6;letter-spacing:4px}
.subtitle{font-size:12px;color:#9eabb9;margin-top:6px}
.game{width:96%;max-width:900px;margin:16px auto}
.players{display:flex;gap:10px;margin-bottom:12px}
.player{flex:1;background:#202b39;padding:12px;border-radius:10px}
.health{height:12px;background:#424b57;border-radius:10px;overflow:hidden}
.health-fill{height:100%;width:100%;background:#39dc86;transition:width .2s}
.hp-text{font-size:13px;margin-top:6px}
canvas{display:block;width:100%;height:auto;border:2px solid #3bd6c6;border-radius:10px}
.turn{color:#3bd6c6;font-weight:bold;margin:12px}
.controls{background:#202b39;padding:16px;border-radius:12px;text-align:left}
.row{margin:14px 0}
label{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px}
input{width:100%;accent-color:#3bd6c6}
.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
button{padding:12px;border:0;border-radius:8px;background:#354455;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
.fire{background:#f05a48;flex:1}
.reset{background:#3bd6c6;color:#10151d}
.note{font-size:12px;color:#9eabb9;line-height:1.5;margin-top:14px}
</style>
</head>

<body>
<header>
<h1>TANK WAR</h1>
<div class="subtitle">TACTICAL TANK COMBAT · PROTOTYPE 0.2</div>
</header>

<main class="game">
<div class="players">
<div class="player">
<b>🔵 PLAYER 1</b>
<div class="health"><div id="bar1" class="health-fill"></div></div>
<div id="hp1" class="hp-text">100 / 100 HP</div>
</div>
<div class="player">
<b>🔴 PLAYER 2</b>
<div class="health"><div id="bar2" class="health-fill"></div></div>
<div id="hp2" class="hp-text">100 / 100 HP</div>
</div>
</div>

<canvas id="field" width="800" height="400"></canvas>
<div id="turn" class="turn">PLAYER 1'S TURN</div>

<section class="controls">
<div class="row">
<label>Angle <b><span id="angleText">45</span>°</b></label>
<input id="angle" type="range" min="10" max="80" value="45">
</div>
<div class="row">
<label>Power <b><span id="powerText">50</span>%</b></label>
<input id="power" type="range" min="10" max="100" value="50">
</div>
<div class="buttons">
<button id="left">◀ MOVE</button>
<button id="right">MOVE ▶</button>
<button id="fire" class="fire">🔥 FIRE</button>
<button id="reset" class="reset">↻ RESET</button>
</div>
<div class="note">
Local two-player prototype. Take turns moving and firing.
Online multiplayer will be added later.
</div>
</section>
</main>

<script>
const canvas = document.getElementById("field");
const ctx = canvas.getContext("2d");
const angle = document.getElementById("angle");
const power = document.getElementById("power");

let tanks, active, busy, gameOver, shell, blast, message;

function ground(x) {
  return 315 - Math.sin(x / 100) * 12;
}

function reset() {
  tanks = [
    {x:100,hp:100,color:"#37a8ff"},
    {x:700,hp:100,color:"#ff554f"}
  ];
  active = 0;
  busy = false;
  gameOver = false;
  shell = null;
  blast = null;
  message = "";
  angle.value = 45;
  power.value = 50;
  update();
  draw();
}

function drawTank(t, i) {
  const y = ground(t.x);
  ctx.save();
  ctx.translate(t.x, y);

  // Tracks
  ctx.fillStyle = "#303841";
  ctx.fillRect(-28,-14,56,14);
  for(let x=-20;x<=20;x+=13) {
    ctx.beginPath();
    ctx.arc(x,-7,4,0,Math.PI*2);
    ctx.fillStyle="#aab2ba";
    ctx.fill();
  }

  // Body
  ctx.fillStyle=t.color;
  ctx.fillRect(-24,-27,48,15);

  // Turret
  ctx.fillStyle=i===0?"#1875b9":"#c93635";
  ctx.fillRect(-13,-36,26,13);

  // Barrel points toward the opponent
  const a = Number(angle.value)*Math.PI/180;
  const direction = i===0?1:-1;
  ctx.translate(0,-30);
  ctx.rotate(-direction*a);
  ctx.fillStyle="#e5e9ec";
  ctx.fillRect(0,-3,direction*29,6);

  ctx.restore();
}

function background() {
  const sky=ctx.createLinearGradient(0,0,0,400);
  sky.addColorStop(0,"#f7d89b");
  sky.addColorStop(1,"#e9b96d");
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,800,400);

  ctx.fillStyle="#d9a65b";
  ctx.beginPath();
  ctx.moveTo(0,260);
  for(let x=0;x<=800;x+=10)
    ctx.lineTo(x,245+Math.sin(x/85)*17);
  ctx.lineTo(800,400);
  ctx.lineTo(0,400);
  ctx.fill();

  ctx.fillStyle="#b98642";
  ctx.beginPath();
  ctx.moveTo(0,ground(0));
  for(let x=0;x<=800;x+=5)
    ctx.lineTo(x,ground(x));
  ctx.lineTo(800,400);
  ctx.lineTo(0,400);
  ctx.fill();

  ctx.fillStyle="#fff0b4";
  ctx.beginPath();
  ctx.arc(680,65,27,0,Math.PI*2);
  ctx.fill();
}

function draw() {
  background();

  tanks.forEach((tank,index)=>drawTank(tank,index));

  // Aiming guide
  if(!busy&&!gameOver) {
    const t=tanks[active];
    const dir=active===0?1:-1;
    const a=Number(angle.value)*Math.PI/180;
    const p=Number(power.value);
    ctx.beginPath();
    ctx.setLineDash([5,7]);
    ctx.strokeStyle="rgba(255,255,255,.8)";
    ctx.lineWidth=2;
    ctx.moveTo(t.x,ground(t.x)-30);

    for(let n=1;n<=22;n++) {
      const d=n*(p/8+1);
      ctx.lineTo(
        t.x+dir*Math.cos(a)*d*2,
        ground(t.x)-30-Math.sin(a)*d*1.5+.018*d*d
      );
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if(shell) {
    ctx.beginPath();
    ctx.arc(shell.x,shell.y,6,0,Math.PI*2);
    ctx.fillStyle="#ff572e";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(shell.x-2,shell.y-2,2,0,Math.PI*2);
    ctx.fillStyle="#fff3aa";
    ctx.fill();
  }

  if(blast) {
    ctx.beginPath();
    ctx.arc(blast.x,blast.y,blast.r,0,Math.PI*2);
    ctx.fillStyle="rgba(255,90,30,.65)";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(blast.x,blast.y,blast.r*.55,0,Math.PI*2);
    ctx.fillStyle="#ffd34d";
    ctx.fill();
  }

  if(gameOver) {
    ctx.fillStyle="rgba(10,15,22,.78)";
    ctx.fillRect(0,0,800,400);
    ctx.fillStyle="white";
    ctx.textAlign="center";
    ctx.font="bold 36px Arial";
    ctx.fillText(message,400,190);
    ctx.font="18px Arial";
    ctx.fillText("Press RESET to play again",400,230);
  }
}

function update() {
  tanks.forEach((t,i)=>{
    document.getElementById("hp"+(i+1)).textContent=t.hp+" / 100 HP";
    const bar=document.getElementById("bar"+(i+1));
    bar.style.width=t.hp+"%";
    bar.style.background=t.hp>50?"#39dc86":t.hp>25?"#ffd34d":"#ff554f";
  });

  document.getElementById("angleText").textContent=angle.value;
  document.getElementById("powerText").textContent=power.value;

  document.getElementById("turn").textContent =
    gameOver?message:busy?"SHELL IN FLIGHT...":"PLAYER "+(active+1)+"'S TURN";

  ["left","right","fire"].forEach(id=>{
    document.getElementById(id).disabled=busy||gameOver;
  });
}

function move(amount) {
  if(busy||gameOver)return;
  const t=tanks[active], other=tanks[1-active];
  const nx=t.x+amount;
  if(nx<35||nx>765||Math.abs(nx-other.x)<60)return;
  t.x=nx;
  draw();
}

function fire() {
  if(busy||gameOver)return;
  busy=true;

  const t=tanks[active];
  const dir=active===0?1:-1;
  const a=Number(angle.value)*Math.PI/180;
  const speed=3+Number(power.value)*.12;

  shell={
    x:t.x+dir*25,
    y:ground(t.x)-30,
    vx:dir*Math.cos(a)*speed,
    vy:-Math.sin(a)*speed,
    shooter:active
  };
  update();
  animateShell();
}

function animateShell() {
  if(!shell)return;

  shell.x+=shell.vx;
  shell.y+=shell.vy;
  shell.vy+=.12;

  const target=tanks[1-shell.shooter];
  const shooter=tanks[shell.shooter];
  const hitTarget=Math.abs(shell.x-target.x)<24 &&
    shell.y>=ground(target.x)-40;
  const hitShooter=Math.abs(shell.x-shooter.x)<24 &&
    shell.y>=ground(shooter.x)-40;
  const hitGround=shell.y>=ground(Math.max(0,Math.min(800,shell.x)));

  if(hitTarget||hitShooter||hitGround||
     shell.x<0||shell.x>800||shell.y>400) {
    explode(shell.x,shell.y);
    return;
  }

  draw();
  requestAnimationFrame(animateShell);
}

function explode(x,y) {
  const shooter=shell.shooter;
  shell=null;
  x=Math.max(0,Math.min(800,x));
  y=Math.max(0,Math.min(400,y));

  tanks.forEach(t=>{
    const d=Math.hypot(t.x-x,ground(t.x)-y);
    if(d<85) {
      const damage=Math.round(40*(1-d/110));
      t.hp=Math.max(0,t.hp-damage);
    }
  });

  const dead=tanks.map(t=>t.hp===0);
  if(dead[0]&&dead[1]) {
    gameOver=true;
    message="DRAW!";
  } else if(dead[0]||dead[1]) {
    gameOver=true;
    message="PLAYER "+(dead[0]?2:1)+" WINS!";
  }

  blast={x,y,r:8};
  update();
  draw();

  let frame=0;
  function animateBlast() {
    frame++;
    if(blast)blast.r=8+frame*2.5;
    draw();

    if(frame<12) {
      requestAnimationFrame(animateBlast);
    } else {
      blast=null;
      if(!gameOver)active=1-shooter;
      busy=false;
      update();
      draw();
    }
  }
  animateBlast();
}

document.getElementById("left").onclick=()=>move(-18);
document.getElementById("right").onclick=()=>move(18);
document.getElementById("fire").onclick=fire;
document.getElementById("reset").onclick=reset;

angle.oninput=()=>draw();
power.oninput=()=>draw();

reset();
</script>
</body>
</html>
