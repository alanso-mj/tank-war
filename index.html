<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tank War</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #10151d;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 18px;
  background: #182331;
  border-bottom: 2px solid #3bd6c6;
}

h1 {
  margin: 0;
  color: #3bd6c6;
  letter-spacing: 3px;
}

.subtitle {
  color: #9eabb9;
  font-size: 12px;
  margin-top: 6px;
}

.game {
  width: 94%;
  max-width: 900px;
  margin: 18px auto;
}

.players {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.player {
  flex: 1;
  padding: 12px;
  background: #202b39;
  border-radius: 10px;
  border: 1px solid #354455;
}

.name {
  font-weight: bold;
  margin-bottom: 8px;
}

.health {
  height: 12px;
  background: #424b57;
  border-radius: 10px;
  overflow: hidden;
}

.health-fill {
  height: 100%;
  width: 100%;
  background: #39dc86;
  transition: width .25s;
}

.hp-text {
  margin-top: 6px;
  font-size: 13px;
}

canvas {
  display: block;
  width: 100%;
  border: 2px solid #3bd6c6;
  border-radius: 10px;
  background: #d9a65b;
}

.turn {
  margin: 12px 0;
  color: #3bd6c6;
  font-weight: bold;
}

.controls {
  background: #202b39;
  border-radius: 12px;
  padding: 16px;
  text-align: left;
}

.control-row {
  margin: 14px 0;
}

label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 14px;
}

input[type="range"] {
  width: 100%;
  accent-color: #3bd6c6;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 12px 15px;
  background: #354455;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}

.fire {
  background: #f05a48;
  flex: 1;
}

.reset {
  background: #3bd6c6;
  color: #10151d;
}

.note {
  font-size: 12px;
  color: #9eabb9;
  line-height: 1.5;
  margin-top: 14px;
}

@media (max-width: 450px) {
  .game {
    width: 96%;
  }

  .player {
    padding: 9px;
  }

  button {
    padding: 11px;
  }
}
</style>
</head>

<body>

<header>
  <h1>TANK WAR</h1>
  <div class="subtitle">TACTICAL TANK COMBAT · PROTOTYPE 0.1</div>
</header>

<main class="game">

  <div class="players">
    <div class="player">
      <div class="name">🔵 PLAYER 1</div>
      <div class="health">
        <div id="health1" class="health-fill"></div>
      </div>
      <div id="hp1" class="hp-text">100 / 100 HP</div>
    </div>

    <div class="player">
      <div class="name">🔴 PLAYER 2</div>
      <div class="health">
        <div id="health2" class="health-fill"></div>
      </div>
      <div id="hp2" class="hp-text">100 / 100 HP</div>
    </div>
  </div>

  <canvas id="battlefield" width="800" height="400"></canvas>

  <div id="turn" class="turn">PLAYER 1'S TURN</div>

  <section class="controls">

    <div class="control-row">
      <label>
        <span>Aim angle</span>
        <span><b id="angleValue">45</b>°</span>
      </label>
      <input id="angle" type="range" min="10" max="170" value="45">
    </div>

    <div class="control-row">
      <label>
        <span>Shot power</span>
        <span><b id="powerValue">50</b>%</span>
      </label>
      <input id="power" type="range" min="0" max="100" value="50">
    </div>

    <div class="buttons">
      <button id="left">◀ MOVE</button>
      <button id="right">MOVE ▶</button>
      <button id="fire" class="fire">🔥 FIRE</button>
      <button id="reset" class="reset">↻ RESET</button>
    </div>

    <div class="note">
      Prototype controls: move your tank, set the angle and power,
      then fire. This is a local two-player test, not online multiplayer yet.
    </div>

  </section>
</main>

<script>
const canvas = document.getElementById("battlefield");
const ctx = canvas.getContext("2d");

const angleSlider = document.getElementById("angle");
const powerSlider = document.getElementById("power");

let tanks;
let active = 0;
let busy = false;
let gameOver = false;
let projectile = null;
let explosion = null;
let message = "";

function resetGame() {
  tanks = [
    { x: 100, hp: 100, color: "#37a8ff", barrel: 0 },
    { x: 700, hp: 100, color: "#ff554f", barrel: 180 }
  ];

  active = 0;
  busy = false;
  gameOver = false;
  projectile = null;
  explosion = null;
  message = "";

  angleSlider.value = 45;
  powerSlider.value = 50;

  updateUI();
  draw();
}

function groundY(x) {
  return 315 - Math.sin(x / 100) * 12;
}

function drawTank(tank, index) {
  const y = groundY(tank.x);
  const facing = index === 0 ? 1 : -1;

  ctx.save();
  ctx.translate(tank.x, y);

  // Tracks
  ctx.fillStyle = "#303841";
  ctx.fillRect(-27, -14, 54, 14);

  // Track wheels
  for (let i = -19; i <= 19; i += 13) {
    ctx.beginPath();
    ctx.arc(i, -7, 4, 0, Math.PI * 2);
    ctx.fillStyle = "#929ba3";
    ctx.fill();
  }

  // Tank body
  ctx.fillStyle = tank.color;
  ctx.fillRect(-23, -25, 46, 15);

  // Turret
  ctx.fillStyle = index === 0 ? "#1875b9" : "#c93635";
  ctx.fillRect(-12, -34, 24, 12);

  // Barrel
  ctx.save();
  ctx.translate(0, -29);

  const radians = tank.barrel * Math.PI / 180;
  ctx.rotate(index === 0 ? -radians : radians);

  ctx.fillStyle = "#d9e0e5";
  ctx.fillRect(0, -3, facing * 25, 6);

  ctx.restore();

  ctx.restore();
